name: Idea or improvement
description: Suggest a useful change.
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe your workflow and the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: Optional. Describe your idea and any alternatives you have considered.
